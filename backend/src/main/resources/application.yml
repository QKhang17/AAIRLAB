server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # Keep provider credentials outside the packaged classpath. The file is optional
    # so production can use a mounted secret file or environment variables.
    import: optional:file:${AI_KEYS_FILE:./secrets/application-ai-keys.yml}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: aair-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aair_db}
    # Never fall back to the PostgreSQL superuser. Deployment must provide a
    # dedicated least-privilege application role explicitly.
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: true
            required: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

app:
  mail:
    from: ${MAIL_FROM:${spring.mail.username:}}
  storage:
    directory: ${UPLOAD_DIRECTORY:./uploads}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAMESITE:Lax}
  jwt:
    # Không dùng fallback: deployment phải cung cấp khóa ngẫu nhiên tối thiểu 32 bytes.
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  ai:
    gemini:
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      api-key: ${GEMINI_API_KEY:}
    groq:
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      api-key: ${GROQ_API_KEY:}
    openai:
      model: ${OPENAI_MODEL:gpt-5}
      api-key: ${OPENAI_API_KEY:}
    claude:
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      api-key: ${ANTHROPIC_API_KEY:}

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      show-details: never
