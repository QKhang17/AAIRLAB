<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AAIR Lab · UI Preview</title>
  <style>
    :root{--blue:#079bc3;--blue-dark:#087da1;--ink:#172333;--muted:#687688;--line:#dce4ea;--surface:#f5f8fa;--green:#159b6a;--amber:#e29b08;--red:#c64747;--shadow:0 8px 24px #1a34410d}*{box-sizing:border-box}body{margin:0;background:var(--surface);font:14px Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0}.topbar{height:68px;background:var(--blue);color:white;display:flex;align-items:center;padding:0 28px;gap:28px}.brand{font-size:18px;font-weight:800;letter-spacing:.2px;margin-right:12px}.nav{display:flex;height:100%}.nav button{background:transparent;color:#fff;border-left:1px solid #ffffff38;padding:0 24px}.nav button.active{background:#087da1;font-weight:700;box-shadow:inset 0 -3px #fff}.account{margin-left:auto;display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#087da1;font-weight:800}.logout{border:1px solid #fff;background:transparent;color:#fff;border-radius:8px;padding:9px 14px}.previewbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;display:flex;gap:14px;align-items:center}.previewbar strong{margin-right:10px}.previewbar select{padding:8px 12px;border:1px solid #cbd6df;border-radius:8px;background:white}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 118px)}.sidebar{background:#f8fafb;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}.side-title{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em;padding:0 10px 12px}.side-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;padding:12px 10px;border-radius:8px;color:#425166}.side-item.active{background:#e4f3f8;color:#006ca0;font-weight:700}.side-icon{width:22px;text-align:center;color:#087da1}.side-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:14px 10px}.content{padding:26px;overflow:auto}.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.page-head h1{margin:0;font-size:24px}.muted{color:var(--muted)}.actions{display:flex;gap:10px}.primary,.secondary,.danger{border-radius:8px;padding:10px 16px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid #b9c9d4;color:#236078}.danger{background:#fff0f0;color:var(--red);border:1px solid #efb4b4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.metric{font-size:30px;font-weight:800}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.table th,.table td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted);text-transform:uppercase;background:#f8fafb}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#edf1f4;color:#506174}.badge.green{background:#e2f6ed;color:#087b51}.badge.amber{background:#fff3d7;color:#956500}.badge.red{background:#fde8e8;color:#a52c2c}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid #cbd6df;border-radius:8px;padding:11px;background:#fff}.field textarea{min-height:100px;resize:vertical}.task{display:grid;grid-template-columns:230px minmax(360px,1fr) minmax(360px,470px);height:calc(100vh - 118px);margin:-26px}.task-side{background:#f8fafb;border-right:1px solid var(--line);padding:14px}.task-side .side-item{font-size:13px}.pdf{background:#eef2f4;padding:16px;display:flex;flex-direction:column;min-width:0}.pdf-head,.panel-head{background:#282d35;color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;border-radius:8px 8px 0 0}.pdf-page{background:#fff;flex:1;margin:0 auto;width:88%;max-width:680px;box-shadow:0 5px 18px #1327331c;padding:55px 48px;margin-top:16px;overflow:hidden}.pdf-page h2{font-size:30px;text-align:center;margin-top:110px;color:#0b326e}.pdf-page .red{color:#b41616;text-align:center;font-size:26px;margin-top:80px}.details{background:#fff;border-left:1px solid var(--line);padding:18px;overflow:auto}.details h2{font-size:17px;margin:0 0 18px}.result{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;background:#fff}.result .term{font-weight:800;background:#f3f6f8;border:1px solid #9eabb5;padding:12px;margin-top:5px}.result textarea{width:100%;min-height:80px;border:1px solid #cbd6df;border-radius:7px;padding:10px;margin-top:5px}.source{margin-top:10px;padding:12px;border-left:3px solid #42b7cb;background:#edf9fb}.sticky-save{position:sticky;bottom:0;background:#fff;padding-top:14px;margin-top:16px;border-top:1px solid var(--line);text-align:right}.status-dot{width:11px;height:11px;border-radius:50%;border:1px solid #9caab6;display:inline-block;margin-left:auto}.status-dot.saved{background:var(--green);border-color:#087b51}.status-dot.ai{background:var(--amber);border-color:#b87800}.legend{font-size:12px;color:var(--muted);padding:15px 0}.role-note{padding:10px 12px;background:#eef8fb;border:1px solid #c5e8f0;border-radius:8px;color:#17627a;margin-bottom:18px}.hidden{display:none}@media(max-width:1100px){.task{grid-template-columns:190px 1fr}.details{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:760px){.topbar{padding:0 12px;gap:10px}.nav button{padding:0 10px}.shell{grid-template-columns:1fr}.sidebar{display:none}.content{padding:16px}.task{margin:-16px;grid-template-columns:1fr}.task-side{display:none}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">△ AAIR Lab</div><nav class="nav"><button class="active">Dashboard</button><button>View ALL</button><button>Session</button><button id="promptNav">Prompt</button></nav><div class="account"><div class="avatar" id="avatar">AD</div><div><strong id="userName">admin01</strong><small style="display:block;opacity:.8" id="roleName">Admin</small></div><button class="logout">Log out</button></div></header>
  <div class="previewbar"><strong>Preview only</strong><span class="muted">Chọn role để xem bản thiết kế đề xuất:</span><select id="role"><option value="admin">Admin</option><option value="manager">Manager</option><option value="manual">Manual Labeler</option><option value="ai">AI Labeler</option><option value="reviewer">Reviewer</option><option value="analyst">Result Analyst</option><option value="terms">Terminology</option></select><select id="screen"></select><span class="badge amber">Chưa áp dụng vào AAIR_LAB</span></div>
  <main class="shell"><aside class="sidebar"><div class="side-title" id="sideTitle">Admin workspace</div><div id="sideItems"></div><div class="side-bottom">Preview state · UI proposal</div></aside><section class="content" id="app"></section></main>
  <script>
    const roles={
      admin:{label:'Admin',user:'admin01',screens:['Dashboard','Manager Management','Permission Management','System Monitoring','Log View']},
      manager:{label:'Manager',user:'manager01',screens:['Dashboard','User Management','Document Management','Session Management','Statistics']},
      manual:{label:'Manual Labeler',user:'manual_labeler01',screens:['Dashboard','View ALL','Task']},
      ai:{label:'AI Labeler',user:'ai_labeler01',screens:['Dashboard','Prompt','View ALL','Task']},
      reviewer:{label:'Reviewer',user:'reviewer01',screens:['Dashboard','View ALL','Review Task']},
      analyst:{label:'Result Analyst',user:'analyst01',screens:['Dashboard','View ALL','Result Analysis']},
      terms:{label:'Terminology',user:'terminology01',screens:['Dashboard','Base Management']}
    };
    const roleEl=document.querySelector('#role'),screenEl=document.querySelector('#screen');
    function card(title,body){return `<article class="card"><h3>${title}</h3>${body}</article>`}
    function dashboard(r){return `<div class="page-head"><div><h1>${r.label} Dashboard</h1><p class="muted">Tổng quan công việc và trạng thái mới nhất</p></div><div class="actions"><button class="secondary">Export</button><button class="primary">Refresh</button></div></div><div class="role-note"><strong>Preview:</strong> Đây là bản giao diện mẫu. Các hành động chỉ mô phỏng, chưa gọi API thật.</div><div class="grid">${card('Assigned tasks','<div class="metric">24</div><span class="muted">Documents assigned</span>')}${card('Completed','<div class="metric" style="color:var(--green)">18</div><span class="muted">75% completion</span>')}${card('Pending review','<div class="metric" style="color:var(--amber)">6</div><span class="muted">Need attention</span>')}</div><div style="height:16px"></div><div class="card"><h2>Recent activity</h2><table class="table"><tr><th>Item</th><th>Status</th><th>Updated</th></tr><tr><td>AG1_2024_CN.pdf</td><td><span class="badge green">Saved</span></td><td>2 minutes ago</td></tr><tr><td>AG1_2022_CN.pdf</td><td><span class="badge amber">AI run · not saved</span></td><td>10 minutes ago</td></tr></table></div>`}
    function management(title,action){return `<div class="page-head"><div><h1>${title}</h1><p class="muted">Quản lý dữ liệu với trạng thái rõ ràng</p></div><button class="primary">＋ ${action}</button></div><div class="card"><div class="actions" style="margin-bottom:14px"><input placeholder="Search..." style="flex:1;border:1px solid var(--line);border-radius:8px;padding:10px"><select><option>All statuses</option><option>Active</option><option>Inactive</option></select><button class="secondary">Filter</button></div><table class="table"><tr><th>Name</th><th>Role / Type</th><th>Status</th><th>Action</th></tr><tr><td>AG1_2024_CN.pdf</td><td>Financial document</td><td><span class="badge green">Active</span></td><td><button class="secondary">View</button></td></tr><tr><td>AG1_2023_CN.pdf</td><td>Financial document</td><td><span class="badge amber">Pending</span></td><td><button class="secondary">View</button></td></tr></table></div>`}
    function form(title,ai=false){return `<div class="page-head"><div><h1>${title}</h1><p class="muted">Cấu hình trước khi bắt đầu xử lý</p></div><button class="primary">Save</button></div><div class="card"><div class="form-grid"><div class="field"><label>Session name</label><input value="Q4 Performance Audit"></div><div class="field"><label>Session type</label><select><option>${ai?'AI':'Manual'} labeling</option></select></div><div class="field"><label>${ai?'AI Labeler':'Manual Labeler'}</label><select><option>${ai?'ai_labeler01':'manual_labeler01'} — AVAILABLE</option></select></div><div class="field"><label>Reviewer</label><select><option>reviewer01 — AVAILABLE</option></select></div><div class="field full"><label>Documents</label><textarea placeholder="Upload PDF files or drag them here..."></textarea></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="secondary">Cancel</button><button class="primary">Create Session</button></div></div>`}
    function task(ai=false){return `<div class="task"><aside class="task-side"><div class="side-title">Documents · 4/5</div>${['AG1_2024_CN.pdf','AG1_2023_CN.pdf','AG1_2022_CN.pdf','Lecture 5 - Syntax.pdf'].map((x,i)=>`<button class="side-item ${i===2?'active':''}">▣ <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x}</span><span class="status-dot ${i<2?'saved':i===2?(ai?'ai':''):'ai'}" title="${i<2?'Saved':i===2?(ai?'AI run – not saved':'Not run yet'):'AI run – not saved'}"></span></button>`).join('')}<div class="legend"><span style="color:var(--green)">●</span> Saved<br><span style="color:var(--amber)">●</span> AI run, not saved<br><span>○</span> Not run yet</div></aside><section class="pdf"><div class="pdf-head"><strong>AG1_2022_CN.pdf</strong><span>Page 1 / 35　−　100%　＋</span></div><div class="pdf-page"><h2>CONG TY CO PHAN 28.1</h2><div class="red">BÁO CÁO TÀI CHÍNH ĐÃ ĐƯỢC KIỂM TOÁN</div><p style="text-align:center;margin-top:120px">Cho năm tài chính kết thúc ngày 31/12/2022</p></div></section><section class="details"><div class="page-head" style="margin-bottom:8px"><div><h2>${ai?'AI Extraction':'Extracted Information'}</h2><span class="muted">Document Info · AG1_2022_CN.pdf</span></div>${ai?'<button class="primary">Run AI</button>':''}</div>${['company_name','industry'].map((x,i)=>`<div class="result"><label class="muted">Term</label><div class="term">${x}</div><label class="muted">Definition</label><textarea>${i?'Sản xuất, thương mại và dịch vụ ngành hàng may mặc.':'CÔNG TY CỔ PHẦN 28.1'}</textarea><div class="source"><strong>SOURCE LABEL</strong><br>${i?'Lĩnh vực kinh doanh':'CÔNG TY CỔ PHẦN 28.1'}</div><label class="muted" style="display:block;margin-top:10px">Source Page</label><input value="${i+1}" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:7px"></div>`).join('')}<div class="sticky-save"><button class="secondary">Submit Task</button><button class="primary">Save</button></div></section></div>`}
    function render(){const r=roles[roleEl.value];document.querySelector('#userName').textContent=r.user;document.querySelector('#roleName').textContent=r.label;document.querySelector('#avatar').textContent=r.label.split(' ').map(x=>x[0]).join('').slice(0,2);document.querySelector('#sideTitle').textContent=r.label+' workspace';screenEl.innerHTML=r.screens.map(x=>`<option>${x}</option>`).join('');document.querySelector('#sideItems').innerHTML=r.screens.map((x,i)=>`<button class="side-item ${i===0?'active':''}">▣ ${x}</button>`).join('');const s=screenEl.value;let html;if(s==='Task'||s==='Review Task'||s==='Result Analysis')html=task(roleEl.value==='ai');else if(s==='Dashboard')html=dashboard(r);else if(s==='Session Management')html=form('Create Session',false);else if(s==='Prompt')html=management('Prompt Library','New Prompt');else if(s==='Base Management')html=management('Terminology Base','New Term');else if(s==='User Management')html=management('User Management','New User');else if(s==='Document Management')html=management('Document Management','Upload PDF');else html=management(s,'New');document.querySelector('#app').innerHTML=html}
    roleEl.onchange=render;screenEl.onchange=render;render();
  </script>
</body>
</html>
