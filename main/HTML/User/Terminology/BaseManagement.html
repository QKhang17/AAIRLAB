<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Management</title>
    <link rel="icon" type="image/svg+xml" href="/resource/icon/brand/aair-logo.svg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <script src="../../../JavaScript/tailwind.js"></script>
    <link href="../../../Style/basic.css" rel="stylesheet">
    <link href="../../../Style/navbar.css" rel="stylesheet">
</head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <div data-aair-navbar-mount></div>

    <!-- TopNavBar -->
    <header class="w-full h-12
           flex items-center gap-2 px-lg
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-50 mb-4">

        <div class="relative flex-1 W-[240px] ">
            <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">filter_list</span>
            <input id="termSearch" type="search" aria-label="Search terminology" placeholder="Search terminology, abbreviation or synonyms" class="w-[500px] bg-white border border-outline-variant/60 rounded-lg
                          py-2 pl-10 pr-4 text-body-sm
                          focus:outline-none focus:ring-0 
                          focus:border-outline-variant/60
                          transition-colors">
        </div>

        <div class="flex items-center gap-4">
            <label for="termCategoryFilter" class="text-label-md text-on-surface-variant">Category:</label>
            <select id="termCategoryFilter"
                class="w-[150px] bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                <option value="">All categories</option>
            </select>

            <!-- Buttons -->
            <div class="ml-auto flex items-center gap-2">

                <!-- Hidden CSV File Input -->
                <input type="file" id="csvFileInput" accept=".csv,text/csv" class="hidden">

                <!-- Import CSV Button -->
                <button type="button" onclick="document.getElementById('csvFileInput').click()" class="px-4 py-2
                            rounded-lg
                            text-[12px]
                            bg-button-active
                            text-text-active
                            hover:opacity-85
                            transition-opacity
                            flex items-center gap-2
                            shadow-sm">

                    <span class="material-symbols-outlined text-[14px]">
                        upload_file
                    </span>

                    Import CSV
                </button>

            </div>

    </header>

    <!-- Main Dashboard -->
    <main class="min-h-[calc(100vh-98px)] bg-surface p-5">
      <section class="mx-auto max-w-[1550px] pt-8">
    
        <div class="grid grid-cols-12 gap-4">
            <section
                class="col-span-12 overflow-hidden rounded-lg border border-outline-variant bg-white lg:col-span-7"
            >
                <div class="max-h-[590px] overflow-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="sticky top-0 bg-surface-container-low">
                            <tr>
                                <th class="px-4 py-3">Financial Term</th>
                                <th class="px-4 py-3">Abbreviation</th>
                                <th class="px-4 py-3">Category</th>
                                <th class="px-4 py-3">Status</th>
                                <th class="px-4 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="termRows"></tbody>
                    </table>
                </div>
            </section>
    
            <aside
                class="col-span-12 rounded-lg border border-outline-variant bg-white lg:col-span-5"
            >
                <div
                    class="border-b border-outline-variant bg-surface-container-low px-5 py-4"
                >
                    <h2 class="font-bold">Term Details</h2>
                    <p
                        id="termFormMode"
                        class="mt-1 text-[10px] text-on-surface-variant"
                    >
                        Create new term
                    </p>
                </div>
    
                <form id="termForm" class="grid grid-cols-2 gap-4 p-5">
                    <label class="col-span-2 grid gap-1.5 text-xs font-bold">
                        Financial Term
                        <input
                            id="termName"
                            required
                            maxlength="200"
                            class="rounded-md border-outline-variant text-sm"
                        >
                    </label>
    
                    <label class="grid gap-1.5 text-xs font-bold">
                        Abbreviation
                        <input
                            id="termAbbreviation"
                            maxlength="100"
                            class="rounded-md border-outline-variant text-sm"
                            placeholder="Optional"
                        >
                    </label>
    
                    <label class="grid gap-1.5 text-xs font-bold">
                        Category
                        <input
                            id="termCategory"
                            maxlength="100"
                            list="termCategories"
                            class="rounded-md border-outline-variant text-sm"
                        >
                        <datalist id="termCategories"></datalist>
                    </label>
    
                    <label class="col-span-2 grid gap-1.5 text-xs font-bold">
                        Definition
                        <textarea
                            id="termDefinition"
                            required
                            rows="3"
                            maxlength="20000"
                            class="rounded-md border-outline-variant text-sm"
                        ></textarea>
                    </label>
    
                    <div class="col-span-2">
                        <label class="mb-1.5 block text-xs font-bold">Synonyms</label>
                        <div id="termSynonyms" class="tag-editor">
                            <input
                                aria-label="Add synonym"
                                placeholder="Enter or comma to add"
                            >
                        </div>
                    </div>
    
                    <div class="col-span-2">
                        <label class="mb-1.5 block text-xs font-bold">
                            Related Terms
                        </label>
                        <div id="termRelated" class="tag-editor">
                            <input
                                aria-label="Add related term"
                                list="relatedOptions"
                                placeholder="Search term and press Enter"
                            >
                            <datalist id="relatedOptions"></datalist>
                        </div>
                    </div>
    
                    <label class="col-span-2 grid gap-1.5 text-xs font-bold">
                        Example Usage
                        <textarea
                            id="termExample"
                            rows="2"
                            maxlength="5000"
                            class="rounded-md border-outline-variant text-sm"
                        ></textarea>
                    </label>
    
                    <label class="grid gap-1.5 text-xs font-bold">
                        Status
                        <select
                            id="termStatusEnhanced"
                            class="rounded-md border-outline-variant text-sm"
                        >
                            <option>ACTIVE</option>
                            <option>INACTIVE</option>
                        </select>
                    </label>
    
                    <div
                        class="col-span-2 flex justify-end gap-2 border-t border-outline-variant pt-4"
                    >
                        <button
                            id="termCancel"
                            type="button"
                            class="rounded-md border border-outline-variant px-4 py-2 text-xs font-bold"
                        >
                            Cancel
                        </button>
    
                        <button
                            class="rounded-md bg-primary px-4 py-2 text-xs font-bold text-white"
                        >
                            Save Term
                        </button>
                    </div>
                </form>
            </aside>
        </div>
    
        <section class="mt-4 overflow-hidden rounded-lg border border-outline-variant bg-white">
            <header
                class="flex flex-wrap items-center gap-3 border-b border-outline-variant bg-surface-container-low px-5 py-4"
            >
                <div class="mr-auto">
                    <h2 class="font-bold">History</h2>
                    <p class="mt-1 text-[10px] text-on-surface-variant">
                        Creation, update, and deletion log · newest first
                    </p>
                </div>
    
                <select
                    id="historyUser"
                    class="rounded-md border-outline-variant text-xs"
                >
                    <option value="">All users</option>
                </select>
    
                <select
                    id="historyTerm"
                    class="rounded-md border-outline-variant text-xs"
                >
                    <option value="">All terms</option>
                </select>
            </header>
    
            <div class="max-h-[360px] overflow-auto">
                <table class="w-full text-left text-xs">
                    <thead class="sticky top-0 bg-white">
                        <tr>
                            <th class="px-4 py-3">Time</th>
                            <th class="px-4 py-3">User</th>
                            <th class="px-4 py-3">Action</th>
                            <th class="px-4 py-3">Term</th>
                            <th class="px-4 py-3">Changes</th>
                        </tr>
                    </thead>
                    <tbody id="historyRows"></tbody>
                </table>
            </div>
        </section>
    </section>
    </main>

    <!-- javascript -->
    <script></script>
    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/terminologyManagement.js"></script>
    <script src="../../../JavaScript/navbar.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>
</html>
